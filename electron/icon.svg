<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e34"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5e"/>
      <stop offset="1" stop-color="#ff5e6b"/>
    </linearGradient>
  </defs>
  <!-- Rounded square with the transparent margin macOS expects -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- Timer ring: track, then a ~70% progress arc -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="56"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#ring)" stroke-width="56" stroke-linecap="round"
          stroke-dasharray="1100 1571" transform="rotate(-90 512 512)"/>
  <!-- The logo dot -->
  <circle cx="512" cy="512" r="96" fill="#ff6b5e"/>
</svg>
