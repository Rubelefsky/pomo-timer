# Packaging for the desktop apps. Run via `npm run desktop:mac` / `desktop:win`.
appId: com.rubelefsky.pomotimer
productName: PomoTimer
copyright: Copyright © 2026 Brandon Rubell
directories:
  buildResources: electron
  output: release

# The renderer is fully bundled by Vite into dist/, so no node_modules ship.
files:
  - dist/**
  - electron/main.cjs
  - electron/preload.cjs
  - "!node_modules/**"

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# NSIS 3.12 bundle with native binaries for every host, so the Windows installer
# also builds on Apple Silicon Macs (the legacy 0.0.0 bundle is Intel-only there).
toolsets:
  nsis: "1.2.1"

mac:
  category: public.app-category.productivity
  icon: electron/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]

win:
  icon: electron/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
